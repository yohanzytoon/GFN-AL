seeds: [0, 1]
device: cpu
float_precision: 32
gflownet_root: ../gflownet

env:
  max_length: 7
  num_tokens: 27

oracle:
  budget: 500
  vocabulary_check: true
  enforce_budget: true

metrics:
  optimum_score: 45

dataset:
  num_queries: 500
  unique: true
  sampling_strategy: frequency
  min_length: 3

baseline:
  initial_dataset_queries: 128
  train_fraction: 0.8
  hidden_dim: 256
  n_layers: 2
  dropout: 0.1
  positive_weight: 5.0
  lr: 0.001
  epochs: 100
  batch_size: 64
  candidate_pool_size: 4096
  candidate_sampling_strategy: frequency_score
  candidate_unique: true
  min_length: 3

active:
  initial_size: 96
  batch_size: 12
  candidate_pool_size: 2048
  mutation_pool_size: 1024
  mutation_top_k: 20
  mutation_edits: 2
  local_search_pool_size: 256
  local_search_beam_width: 16
  local_search_steps: 4
  local_search_neighbors_per_step: 80
  local_search_sampling_strategy: frequency_score
  local_search_mutation_edits: 1
  max_rounds: 32
  sampling_strategy: frequency
  initial_sampling_strategy: frequency_score
  candidate_sampling_strategy: frequency_score
  fallback_sampling_strategy: frequency
  mutation_sampling_strategy: frequency_score
  candidate_unique: true
  min_length: 3
  acquisition:
    name: ucb
    beta: 2.0
    xi: 0.0
    thompson_samples: 1
  surrogate:
    type: gp
    fit_maxiter: 60
    prefer_botorch: true
    hidden_dim: 256
    n_layers: 2
    dropout: 0.1
    ensemble_size: 5
    epochs: 50
    batch_size: 64
    lr: 0.001

gflownet:
  n_train_steps: 800
  batch_size_forward: 48
  lr: 0.0001
  z_dim: 16
  lr_z_mult: 10.0
  random_action_prob: 0.05
  reward_min: 0.0
  do_clip_rewards: false
  evaluation_samples: 128
  policy:
    hidden_dim: 256
    n_layers: 3
    shared_backward: false
  evaluator:
    period: 200
    n: 64
    checkpoints_period: 200

hybrid:
  initial_size: 96
  batch_size: 12
  candidate_pool_size: 768
  fallback_random_pool_size: 768
  always_include_random_pool: true
  random_pool_size: 768
  mutation_pool_size: 768
  mutation_top_k: 20
  mutation_edits: 2
  local_search_pool_size: 256
  local_search_beam_width: 16
  local_search_steps: 4
  local_search_neighbors_per_step: 64
  local_search_sampling_strategy: frequency_score
  local_search_mutation_edits: 1
  final_candidate_pool_size: 8192
  final_random_pool_size: 2048
  final_mutation_pool_size: 2048
  final_local_search_pool_size: 0
  max_rounds: 24
  sampling_strategy: frequency
  initial_sampling_strategy: frequency_score
  candidate_sampling_strategy: frequency_score
  fallback_sampling_strategy: frequency
  mutation_sampling_strategy: frequency_score
  candidate_unique: true
  min_length: 3
  acquisition:
    name: ucb
    beta: 2.0
    xi: 0.0
    thompson_samples: 1
  surrogate:
    type: gp
    fit_maxiter: 60
    prefer_botorch: true
    hidden_dim: 256
    n_layers: 2
    dropout: 0.1
    ensemble_size: 5
    epochs: 50
    batch_size: 64
    lr: 0.001
  gflownet:
    n_train_steps: 900
    batch_size_forward: 48
    lr: 0.0001
    z_dim: 16
    lr_z_mult: 10.0
    random_action_prob: 0.02
    reward_min: 0.0001
    do_clip_rewards: true
    retrain_every: 2
    warm_start: true
    refresh_before_final_selection: true
    sample_size: 1024
    final_gflownet_sample_size: 4096
    prediction_mode: mean
    exploration_beta: 0.5
    reward_transform: softplus
    policy:
      hidden_dim: 256
      n_layers: 3
      shared_backward: false
    evaluator:
      period: 200
      n: 64
      checkpoints_period: 200

ablations:
  - name: active_acquisition
    method: active
    parameter: active.acquisition.name
    values: [ucb, ei, uncertainty, thompson]
  - name: active_surrogate
    method: active
    parameter: active.surrogate.type
    values: [gp, ensemble]
  - name: hybrid_acquisition
    method: hybrid
    parameter: hybrid.acquisition.name
    values: [ucb, ei, uncertainty, thompson]
  - name: hybrid_surrogate
    method: hybrid
    parameter: hybrid.surrogate.type
    values: [gp, ensemble]
  - name: hybrid_gflownet_samples
    method: hybrid
    parameter: hybrid.gflownet.sample_size
    values: [128, 256, 512]

analysis:
  metrics: [best_score, top10_score, valid_word_ratio, queries_to_90pct_best]
  curve_keys: [best, top10]

logging:
  output_dir: outputs

hydra:
  run:
    dir: ${logging.output_dir}/ablations/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
