seed: 0
device: cpu

env:
  max_length: 7

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  # If known, set to the true environment optimum for true regret computation
  optimum_score: null

active:
  initial_size: 64
  batch_size: 16
  candidate_pool_size: 512
  max_rounds: 80
  surrogate_type: gp
  acquisition: ucb
  acquisition_beta: 2.0
  ei_xi: 0.01
  surrogate:
    fit_maxiter: 60
    hidden_dim: 256
    n_layers: 2
    dropout: 0.2
    n_models: 5
    epochs: 100
    mc_samples: 40

gflownet:
  repo_root: ../gflownet
  python_bin: python3
  objective: trajectorybalance
  train_steps: 120
  batch_size_forward: 16
  temperature_logits: 1.0
  random_action_prob: 0.0
  eval_samples: 0
  sampling_batch_size: 128
  diversity_samples: 256

hybrid:
  max_rounds: 80
  retrain_frequency: 2
  gfn_candidate_pool_size: 512

logging:
  output_dir: outputs
  use_wandb: false
  wandb_project: gfn-active-learning
  wandb_entity: null

hydra:
  run:
    dir: ${logging.output_dir}/hybrid/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
