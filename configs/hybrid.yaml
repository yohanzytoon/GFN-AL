seed: 0
device: cpu          # cpu | cuda | mps
float_precision: 32
gflownet_root: ../gflownet

env:
  max_length: 7      # maximum word length in tokens (letters)
  num_tokens: 27     # alphabet size + 1 pad token (26 letters + 0)

oracle:
  budget: 1000
  vocabulary_check: true
  enforce_budget: true  # raise when budget is exceeded (stops training automatically)

metrics:
  optimum_score: 45

hybrid:
  # ── Oracle budget allocation ──────────────────────────────────────────────
  initial_size: 192           # oracle queries for the initial warm-up dataset
  batch_size: 8               # oracle queries per AL round
  max_rounds: 110             # hard cap on AL rounds; stops early if budget exhausted
  final_oracle_reserve: 0     # oracle queries reserved for the final GFlowNet selection step
                               # set > 0 to guarantee budget for a high-quality final sweep

  # ── Bootstrap (oracle queries before the GFlowNet starts) ────────────────
  # Before round 0, a heuristic bootstrap loop collects enough positive examples
  # for the surrogate and GFlowNet to train on.
  # bootstrap_budget_fraction: fraction of post-initial budget for bootstrap (default 0.35)
  # bootstrap_batch_size: oracle queries per bootstrap round (default = batch_size)
  # bootstrap_min_rounds: minimum rounds before handing off to AL (default = gflownet.start_round)
  # bootstrap_min_positive_count: stop bootstrap when this many positive scores are collected

  # ── Candidate sampling ────────────────────────────────────────────────────
  # Acquisition candidates are generated by the GFlowNet sampler.
  initial_sampling_strategy: ngram      # strategy for the initial_size warm-up queries
                                          # options: uniform | frequency | frequency_score | ngram | ngram_score
  candidate_unique: true                 # discard candidates already queried

  min_length: 3                          # minimum word length in tokens

  # ── Acquisition ──────────────────────────────────────────────────────────
  # diversity_weight: 0 = pure UCB; higher = more diverse batches via Hamming distance
  diversity_weight: 0.05

  # Plausibility bonus: adds bigram log-prob to surrogate mean to steer
  # acquisition toward word-like candidates (critical with sparse oracle rewards).
  # Set to 0 to disable.
  plausibility_bonus_weight: 2.0

  # Hard plausibility filter: GFlowNet samples below this threshold are discarded.
  # Prevents wasting oracle queries on near-random letter sequences.
  # Range [0, 1]; 0 disables the filter.
  gflownet_candidate_min_plausibility: 0.5

  acquisition:
    name: ucb
    beta: 0.75                # UCB exploration coefficient (lower than standalone AL because GFlowNet already explores)
    beta_min: 0.0             # final beta at last round; linearly decayed from beta → beta_min
    final_beta: 0.0           # beta used for the final GFlowNet selection step (pure exploitation)

  # ── Surrogate GP ─────────────────────────────────────────────────────────
  surrogate:
    type: gp
    fit_maxiter: 100
    prefer_botorch: true
    max_train_points: 1000    # subsample when dataset exceeds this (GP is O(n³) in memory and time)

  # ── Final candidate pool ─────────────────────────────────────────────────
  final_candidate_pool_size: 65536  # GFlowNet samples drawn for the final selection step

  # ── GFlowNet schedule ─────────────────────────────────────────────────────
  gflownet:
    # Training budget per retrain
    n_train_steps: 1000            # gradient steps per GFlowNet training call
    batch_size_forward: 64         # forward trajectories sampled per training step
    batch_size_backward_replay: 32 # backward trajectories replayed from the replay buffer per step
    batch_size_backward_dataset: 32 # backward trajectories from the offline oracle dataset per step

    # Replay buffer — stores high-reward trajectories for off-policy training
    replay_capacity: 1024          # max trajectories stored; 0 disables replay
    replay_sampling: permutation   # how to sample from buffer: permutation | weighted
    train_sampling: weighted       # how to sample forward batch: permutation | weighted

    # Optimiser
    lr: 0.0001
    z_dim: 16
    lr_z_mult: 10.0
    clip_grad_norm: 1.0            # gradient norm clipping (prevents exploding gradients)
    temperature_logits: 1.0        # softmax temperature on policy logits; < 1 sharpens, > 1 flattens

    # Exploration
    random_action_prob: 0.02       # lower than standalone GFlowNet — noisy surrogate reward needs less entropy

    # Reward shaping — transforms surrogate scores into GFlowNet training rewards
    reward_min: 0.01               # floor to prevent degenerate zero-reward trajectories
    do_clip_rewards: true          # clip rewards to [reward_min, score_max]
    reward_transform: exp_beta     # reward transform:
                                    #   identity – raw score (use when scores are already well-scaled)
                                    #   exp_beta – exp(beta_scale × score / score_max), Boltzmann-style
                                    #   softplus – softer alternative, less prone to mode collapse
    beta_scale: 5.0                # sharpness of exp_beta; higher = more peaked reward landscape
    # score_max is set adaptively (see adaptive_score_max below)

    # Adaptive score_max — rescales the exp_beta denominator to the current observed score range.
    # Prevents reward collapse when the surrogate hasn't yet seen high-scoring states.
    adaptive_score_max: true
    score_max_floor: 10.0          # minimum value for the adaptive score_max
    score_max_quantile: 0.9        # use this quantile of observed positive scores as the scale
    # score_max_ceiling: 50.0      # optional hard cap on adaptive score_max

    plausibility_mode: multiplicative  # how to apply plausibility inside the GFlowNet proxy:
                                        #   multiplicative – reward × (1 + weighted plausibility)
                                        #   additive       – reward + weight × plausibility

    # Surrogate prediction mode used when scoring GFlowNet-generated candidates
    prediction_mode: mean          # mean | ucb — use mean for stable GFlowNet training targets
    exploration_beta: 0.5          # beta for ucb prediction mode (ignored when prediction_mode=mean)

    # Retraining schedule
    retrain_every: 8               # retrain the GFlowNet every N AL rounds
    start_round: 0                 # earliest AL round at which GFlowNet training begins
    min_positive_count: 6          # don't train until at least this many positive scores exist
    warm_start: true               # initialise new GFlowNet from previous round's weights

    # Offline dataset — high-value oracle-labelled states used as backward training targets
    offline_train_max_states: 256  # top-N states written to the offline backward dataset per round
    offline_train_min_score: 0.0   # only include states with score > this in the offline dataset

    # Final selection — one extra GFlowNet retrain before spending the reserved oracle budget
    refresh_before_final_selection: true  # retrain one more time before the final oracle sweep
    final_gflownet_sample_size: 16384     # GFlowNet samples for the final candidate pool
    final_sample_batches: 4               # sampling batches for the final pool
    final_max_sample_batches: 8           # max batches if the pool is still too small after initial draw
    final_candidate_min_plausibility: 0.5 # plausibility filter for the final candidate pool
    final_gate_min_score_fraction: 0.75   # skip final oracle queries if the best predicted candidate
                                           # is below this fraction of the current top-10 mean score

    # Per-round candidate sampling
    sample_size: 2048              # GFlowNet states drawn per sampling batch each round
    sample_batches: 2              # initial batches drawn per round
    max_sample_batches: 6          # max batches if unique candidates are still below batch_size
    candidate_min_plausibility: 0.5 # plausibility filter applied to per-round candidates

    policy:
      hidden_dim: 256              # MLP hidden layer width for policy networks
      n_layers: 3                  # number of hidden layers
      shared_backward: false       # if true, backward policy shares weights with forward policy

    evaluator:
      period: 500                  # evaluate every N train steps
      n: 128                       # states sampled during each evaluation
      checkpoints_period: 500      # save a checkpoint every N train steps

logging:
  output_dir: outputs

hydra:
  run:
    dir: ${logging.output_dir}/hybrid/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
