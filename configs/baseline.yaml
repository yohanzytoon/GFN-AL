seed: 0
device: cpu

env:
  max_length: 7

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  # If known, set to the true environment optimum for true regret computation
  optimum_score: null

baseline:
  num_queries: 1000
  train_fraction: 0.8
  hidden_dim: 256
  n_layers: 2
  dropout: 0.1
  lr: 0.001
  epochs: 200
  batch_size: 64

logging:
  output_dir: outputs
  use_wandb: false
  wandb_project: gfn-active-learning
  wandb_entity: null

hydra:
  run:
    dir: ${logging.output_dir}/baseline/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
