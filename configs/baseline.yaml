seed: 0
device: cpu
gflownet_root: ../gflownet

env:
  max_length: 7
  num_tokens: 27

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  optimum_score: 45

dataset:
  path: null

baseline:
  initial_dataset_queries: 200
  train_fraction: 0.8
  hidden_dim: 256
  n_layers: 3
  dropout: 0.1
  positive_weight: 8.0
  lr: 0.001
  epochs: 300
  batch_size: 64
  candidate_pool_size: 16384
  candidate_sampling_strategy: ngram_score
  candidate_unique: true
  min_length: 3

logging:
  output_dir: outputs

hydra:
  run:
    dir: ${logging.output_dir}/baseline/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
