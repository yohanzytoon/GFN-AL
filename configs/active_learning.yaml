seed: 0
device: cpu

env:
  max_length: 7
  num_tokens: 27

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  # If known, set to the true environment optimum for true regret computation
  optimum_score: null

active:
  initial_size: 64
  batch_size: 16
  candidate_pool_size: 512
  max_rounds: 80
  sampling_strategy: uniform
  candidate_unique: true
  min_length: 3
  acquisition:
    name: ucb
    beta: 2.0
    xi: 0.0
    thompson_samples: 1
  surrogate:
    type: gp
    fit_maxiter: 80
    prefer_botorch: true
    hidden_dim: 256
    n_layers: 2
    dropout: 0.1
    ensemble_size: 5
    epochs: 75
    batch_size: 64
    lr: 0.001

logging:
  output_dir: outputs

hydra:
  run:
    dir: ${logging.output_dir}/active/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
