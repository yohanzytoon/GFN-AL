seed: 0
device: cpu

env:
  max_length: 7

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  # If known, set to the true environment optimum for true regret computation
  optimum_score: null

active:
  initial_size: 64
  batch_size: 16
  candidate_pool_size: 512
  max_rounds: 80
  acquisition_beta: 2.0
  surrogate:
    fit_maxiter: 80

logging:
  output_dir: outputs

hydra:
  run:
    dir: ${logging.output_dir}/active/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
