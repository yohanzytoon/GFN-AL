seed: 0
device: cpu
gflownet_root: ../gflownet

env:
  max_length: 7
  num_tokens: 27

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  optimum_score: 45

active:
  initial_size: 96
  batch_size: 16
  candidate_pool_size: 8192
  mutation_pool_size: 4096
  mutation_top_k: 32
  mutation_edits: 3
  local_search_pool_size: 512
  local_search_beam_width: 32
  local_search_steps: 5
  local_search_neighbors_per_step: 128
  local_search_sampling_strategy: ngram_score
  local_search_mutation_edits: 1
  max_rounds: 80
  sampling_strategy: ngram
  initial_sampling_strategy: frequency
  candidate_sampling_strategy: ngram
  fallback_sampling_strategy: frequency
  mutation_sampling_strategy: ngram_score
  candidate_unique: true
  min_length: 3
  diversity_weight: 0.4
  plausibility_bonus_weight: 2.0
  acquisition:
    name: ucb
    beta: 2.5
    beta_min: 0.3
  surrogate:
    type: gp
    fit_maxiter: 100
    prefer_botorch: true
    max_train_points: 750

logging:
  output_dir: outputs

hydra:
  run:
    dir: ${logging.output_dir}/active/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  job:
    chdir: false
