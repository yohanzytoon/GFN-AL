seed: 0
device: cpu

env:
  max_length: 7

oracle:
  budget: 1000
  vocabulary_check: true

metrics:
  # If known, set to the true environment optimum for true regret computation
  optimum_score: null

gflownet:
  repo_root: ../gflownet
  python_bin: python3
  objective: trajectorybalance
  train_steps: 120
  batch_size_forward: 16
  temperature_logits: 1.0
  random_action_prob: 0.0
  eval_samples: 0
  sampling_batch_size: 128
  diversity_samples: 256

logging:
  output_dir: outputs
  use_wandb: false
  wandb_project: gfn-active-learning
  wandb_entity: null
